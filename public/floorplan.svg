<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" fill="none">
  <!-- 假平面圖 — 示意用。等真實渲染圖到位後換掉此檔 + 調 appliances.js 的 pos。 -->
  <defs>
    <style>
      /* ⚠ 這個檔案是用 &lt;img&gt; 載入的（GraphCanvas），外部 CSS 完全打不到，
         所以配色必須寫在檔案裡。要換色改這裡，不是改 style.css。
         極簡版：全部白色不同透明度的 hairline，牆比隔間亮一階、窗最亮。 */
      .wall   { stroke: rgba(255,255,255,0.28); stroke-width: 1.5; }
      .inner  { stroke: rgba(255,255,255,0.14); stroke-width: 1; }
      .win    { stroke: rgba(255,255,255,0.45); stroke-width: 1.5; }
      .floor  { fill: rgba(255,255,255,0.015); }
      .floor2 { fill: rgba(255,255,255,0.03); }
      .lbl    { fill: rgba(255,255,255,0.30); font-family: -apple-system, 'Chiron Hei HK', 'PingFang TC', sans-serif; font-size: 20px; letter-spacing: 2px; }
      .door   { stroke: rgba(255,255,255,0.14); stroke-width: 1; }
    </style>
  </defs>

  <!-- 外牆 -->
  <rect x="40" y="40" width="920" height="600" rx="6" class="wall floor"/>

  <!-- 陽台(上方) -->
  <rect x="120" y="40" width="500" height="78" class="inner floor2"/>
  <line x1="120" y1="42" x2="620" y2="42" class="win"/>
  <text x="320" y="86" text-anchor="middle" class="lbl">陽 台</text>

  <!-- 廚房(左上) -->
  <rect x="40" y="118" width="270" height="190" class="inner floor2"/>
  <text x="175" y="220" text-anchor="middle" class="lbl">廚 房</text>

  <!-- 客餐廳(中央) -->
  <rect x="310" y="118" width="330" height="300" class="inner"/>
  <text x="475" y="290" text-anchor="middle" class="lbl">客 餐 廳</text>

  <!-- 主臥(右上) -->
  <rect x="640" y="118" width="320" height="300" class="inner floor2"/>
  <text x="800" y="280" text-anchor="middle" class="lbl">主 臥</text>

  <!-- 玄關(左下) -->
  <rect x="40" y="460" width="270" height="180" class="inner floor2"/>
  <text x="175" y="560" text-anchor="middle" class="lbl">玄 關</text>
  <!-- 大門 + 開門弧 -->
  <line x1="40" y1="560" x2="40" y2="620" class="win"/>
  <path d="M40 620 A60 60 0 0 0 100 560" class="door"/>

  <!-- 衛浴(中下) -->
  <rect x="310" y="418" width="220" height="222" class="inner floor2"/>
  <text x="420" y="540" text-anchor="middle" class="lbl">衛 浴</text>

  <!-- 次臥(右下) -->
  <rect x="530" y="418" width="430" height="222" class="inner"/>
  <text x="745" y="540" text-anchor="middle" class="lbl">次 臥</text>
</svg>
